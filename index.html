      <!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Contador</title>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  min-height:100vh;
  background:#000;
  color:#fff;
  font-family:Arial,sans-serif;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  padding:20px;
}

#count{
  font-size:150px;
  font-weight:bold;
  line-height:1;
  margin-bottom:45px;
  text-align:center;
}

.buttons{
  display:flex;
  gap:12px;
  margin-bottom:25px;
}

button{
  border:0;
  border-radius:14px;
  padding:16px 24px;
  font-size:18px;
  font-weight:bold;
  cursor:pointer;
}

#start{
  background:#22c55e;
  color:#000;
}

#reset{
  background:#333;
  color:#fff;
}

#heard{
  width:min(90vw,500px);
  min-height:48px;
  padding:14px;
  border-radius:12px;
  background:#151515;
  color:#aaa;
  text-align:center;
  font-size:16px;
}

#status{
  min-height:24px;
  margin-bottom:12px;
  color:#86efac;
  text-align:center;
}

</style>
</head>

<body>

<div id="count">0</div>

<div id="status">Listo</div>

<div class="buttons">

<button id="start">Empezar</button>

<button id="reset">Reiniciar</button>

</div>

<div id="heard">
Lo que escucho aparecerá acá…
</div>


<script>

let count=0;
let active=false;
let rec;


/* =========================================
   NÚMEROS DEL 0 AL 800
========================================= */

const unidades=[
  "cero",
  "uno",
  "dos",
  "tres",
  "cuatro",
  "cinco",
  "seis",
  "siete",
  "ocho",
  "nueve"
];

const especiales={
  10:"diez",
  11:"once",
  12:"doce",
  13:"trece",
  14:"catorce",
  15:"quince",
  16:"dieciseis",
  17:"diecisiete",
  18:"dieciocho",
  19:"diecinueve"
};

const decenas={
  20:"veinte",
  30:"treinta",
  40:"cuarenta",
  50:"cincuenta",
  60:"sesenta",
  70:"setenta",
  80:"ochenta",
  90:"noventa"
};

const centenas={
  100:"cien",
  200:"doscientos",
  300:"trescientos",
  400:"cuatrocientos",
  500:"quinientos",
  600:"seiscientos",
  700:"setecientos",
  800:"ochocientos"
};


/* =========================================
   NORMALIZAR TEXTO
========================================= */

function normal(text){

  return text
    .toLowerCase()
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g,"")
    .replace(/[.,!?¿¡]/g," ")
    .replace(/\s+/g," ")
    .trim();

}


/* =========================================
   CONVERTIR 1-99
========================================= */

function convertirMenor100(n){

  if(n<10){
    return unidades[n];
  }

  if(n<=19){
    return especiales[n];
  }

  if(n===20){
    return "veinte";
  }

  if(n>=21 && n<=29){

    const nombres=[
      "",
      "uno",
      "dos",
      "tres",
      "cuatro",
      "cinco",
      "seis",
      "siete",
      "ocho",
      "nueve"
    ];

    return "veinti"+nombres[n-20];
  }

  const dec=Math.floor(n/10)*10;
  const u=n%10;

  if(u===0){
    return decenas[dec];
  }

  return decenas[dec]+" y "+unidades[u];

}


/* =========================================
   CREAR TODOS LOS NÚMEROS 0-800
========================================= */

const numberWords={};


/* 0-9 */

for(let i=0;i<=9;i++){
  numberWords[unidades[i]]=i;
}


/* 10-19 */

for(let i=10;i<=19;i++){
  numberWords[especiales[i]]=i;
}


/* 20-99 */

for(let i=20;i<=99;i++){
  numberWords[convertirMenor100(i)]=i;
}


/* 100-800 */

for(let cen=100;cen<=800;cen+=100){

  numberWords[centenas[cen]]=cen;

  if(cen===800) break;

  for(let resto=1;resto<=99;resto++){

    let texto;

    if(cen===100){

      texto="ciento "+convertirMenor100(resto);

    }else{

      texto=centenas[cen]+" "+convertirMenor100(resto);

    }

    numberWords[texto]=cen+resto;

  }

}


/* =========================================
   AGREGAR VERSIONES SIN ACENTOS
========================================= */

for(const word of Object.keys(numberWords)){

  numberWords[normal(word)]=numberWords[word];

}


/* =========================================
   PROCESAR VOZ
========================================= */

function process(text){

  const clean=normal(text);

  document.getElementById("heard").textContent=
    "Escuché: "+text.trim();


  const words=clean.split(/\s+/);

  let i=0;


  while(i<words.length){

    let found=null;


    /*
      PALABRAS PARA CONTAR UNA VUELTA
    */

    if(
      words[i]==="siguiente" ||
      words[i]==="vuelta" ||
      words[i]==="una"
    ){

      found={
        length:1
      };

    }


    /*
      BUSCAR NÚMEROS
    */

    if(!found){

      for(let length=5;length>=1;length--){

        if(i+length>words.length) continue;

        const phrase=
          words.slice(i,i+length).join(" ");


        if(numberWords[phrase]!==undefined){

          found={
            length:length
          };

          break;

        }

      }

    }


    /*
      SUMAR
    */

    if(found){

      count++;

      document.getElementById("count").textContent=
        count;

      i+=found.length;

    }else{

      i++;

    }

  }

}


/* =========================================
   RECONOCIMIENTO DE VOZ
========================================= */

function init(){

  const SR=
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;


  if(!SR){

    document.getElementById("status").textContent=
      "Usá Chrome para reconocer la voz.";

    return;

  }


  rec=new SR();

  rec.lang="es-AR";

  rec.continuous=true;

  rec.interimResults=true;


  rec.onstart=()=>{

    active=true;

    document.getElementById("start").textContent=
      "Detener";

    document.getElementById("status").textContent=
      "Escuchando…";

  };


  rec.onresult=e=>{

    for(
      let i=e.resultIndex;
      i<e.results.length;
      i++
    ){

      if(e.results[i].isFinal){

        process(
          e.results[i][0].transcript
        );

      }

    }

  };


  rec.onerror=e=>{

    document.getElementById("status").textContent=
      e.error==="not-allowed"
      ? "⚠️ Permití el acceso al micrófono."
      : "Error: "+e.error;

  };


  rec.onend=()=>{

    if(active){

      try{
        rec.start();
      }catch(e){}

    }else{

      document.getElementById("start").textContent=
        "Empezar";

      document.getElementById("status").textContent=
        "Pausado";

    }

  };

}


/* =========================================
   EMPEZAR / DETENER
========================================= */

document.getElementById("start").onclick=()=>{

  if(!rec)return;


  if(active){

    active=false;

    rec.stop();

  }else{

    try{
      rec.start();
    }catch(e){}

  }

};


/* =========================================
   REINICIAR
========================================= */

document.getElementById("reset").onclick=()=>{

  count=0;

  document.getElementById("count").textContent=
    "0";

};


init();

</script>

</body>
</html>
