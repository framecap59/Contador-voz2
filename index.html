<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Contador por voz</title>

<style>
body{
  margin:0;
  min-height:100vh;
  display:grid;
  place-items:center;
  background:#111827;
  color:#fff;
  font-family:Arial,sans-serif
}

.card{
  width:min(92vw,520px);
  padding:28px;
  border-radius:24px;
  background:#1f2937;
  text-align:center
}

h1{
  margin:0 0 10px
}

.count{
  font-size:110px;
  font-weight:bold;
  margin:20px 0
}

button{
  padding:14px 20px;
  margin:5px;
  border:0;
  border-radius:12px;
  font-size:17px;
  font-weight:bold
}

#start{
  background:#22c55e
}

#reset{
  background:#374151;
  color:white
}

#heard{
  margin:20px 0;
  padding:12px;
  background:#111827;
  border-radius:10px;
  color:#d1d5db;
  min-height:24px
}

#status{
  color:#86efac;
  min-height:24px
}
</style>
</head>

<body>

<div class="card">

<h1>🎤 Contador por voz</h1>

<div id="count" class="count">0</div>

<div id="status">Listo</div>

<div id="heard">
Lo que escucho aparecerá acá…
</div>

<button id="start">🎙️ Empezar</button>
<button id="reset">↺ Reiniciar</button>

</div>

<script>

let count = 0;
let active = false;
let rec;


/* ==========================================
   CONVERTIR NÚMEROS DEL 0 AL 800 A PALABRAS
========================================== */

const unidades = [
  "cero",
  "uno",
  "dos",
  "tres",
  "cuatro",
  "cinco",
  "seis",
  "siete",
  "ocho",
  "nueve"
];

const especiales = {
  10:"diez",
  11:"once",
  12:"doce",
  13:"trece",
  14:"catorce",
  15:"quince",
  16:"dieciseis",
  17:"diecisiete",
  18:"dieciocho",
  19:"diecinueve"
};

const decenas = {
  20:"veinte",
  30:"treinta",
  40:"cuarenta",
  50:"cincuenta",
  60:"sesenta",
  70:"setenta",
  80:"ochenta",
  90:"noventa"
};

const centenas = {
  100:"cien",
  200:"doscientos",
  300:"trescientos",
  400:"cuatrocientos",
  500:"quinientos",
  600:"seiscientos",
  700:"setecientos",
  800:"ochocientos"
};


/* ==========================================
   NORMALIZAR TEXTO
========================================== */

function normal(text){

  return text
    .toLowerCase()
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g,"")
    .replace(/[.,!?¿¡]/g," ")
    .replace(/\s+/g," ")
    .trim();

}


/* ==========================================
   CREAR TODAS LAS FORMAS DE LOS NÚMEROS
   DEL 0 AL 800
========================================== */

const numberWords = {};


/* Unidades */

for(let i=0;i<=9;i++){
  numberWords[unidades[i]] = i;
}


/* 10 - 19 */

for(let i=10;i<=19;i++){
  numberWords[especiales[i]] = i;
}


/* 20 */

numberWords["veinte"] = 20;


/* 21 - 29 */

const veinti = [
  "",
  "uno",
  "dos",
  "tres",
  "cuatro",
  "cinco",
  "seis",
  "siete",
  "ocho",
  "nueve"
];

for(let i=21;i<=29;i++){
  numberWords["veinti" + veinti[i-20]] = i;
}


/* Decenas 30 - 99 */

for(let dec=30;dec<=90;dec+=10){

  numberWords[decenas[dec]] = dec;

  for(let u=1;u<=9;u++){

    numberWords[
      decenas[dec] + " y " + unidades[u]
    ] = dec + u;

  }
}


/* Centenas 100 - 800 */

for(let cen=100;cen<=800;cen+=100){

  numberWords[centenas[cen]] = cen;

  if(cen === 800) break;

  for(let resto=1;resto<=99;resto++){

    let textoResto = convertirMenor100(resto);

    let texto;

    if(cen === 100){
      texto = "ciento " + textoResto;
    }else{
      texto = centenas[cen] + " " + textoResto;
    }

    numberWords[texto] = cen + resto;

  }
}


/* ==========================================
   CONVERTIR 1 - 99 A PALABRAS
========================================== */

function convertirMenor100(n){

  if(n < 10){
    return unidades[n];
  }

  if(n >= 10 && n <= 19){
    return especiales[n];
  }

  if(n === 20){
    return "veinte";
  }

  if(n >= 21 && n <= 29){
    return "veinti" + veinti[n-20];
  }

  let dec = Math.floor(n/10)*10;
  let u = n%10;

  if(u === 0){
    return decenas[dec];
  }

  return decenas[dec] + " y " + unidades[u];
}


/* ==========================================
   ACEPTAR TAMBIÉN FORMAS CON ACENTOS
========================================== */

for(const [word,value] of Object.entries(numberWords)){

  const original = word;

  const normalized = normal(original);

  numberWords[normalized] = value;

}


/* ==========================================
   BUSCAR UN NÚMERO DENTRO DE LO ESCUCHADO
========================================== */

function findNumber(text){

  const clean = normal(text);

  if(!clean) return null;


  /*
   Primero buscamos frases largas.
   Esto hace que "ciento veintisiete"
   se interprete como 127 y no como
   varios números separados.
  */

  const words = clean.split(/\s+/);

  for(let length=5; length>=1; length--){

    for(let start=0; start<=words.length-length; start++){

      const phrase =
        words.slice(start,start+length).join(" ");

      if(numberWords[phrase] !== undefined){

        return {
          number:numberWords[phrase],
          start:start,
          length:length
        };

      }

    }

  }

  return null;
}


/* ==========================================
   PROCESAR LO QUE DIJO EL USUARIO
========================================== */

function process(text){

  const clean = normal(text);

  document.getElementById("heard").textContent =
    "Escuché: " + text.trim();


  /*
   Buscamos números dentro de la frase.
   Si decís:
   "uno dos tres cuatrocientos veinte"

   detectará:
   1
   2
   3
   420

   y sumará 4 al contador.
  */

  let words = clean.split(/\s+/);

  let i = 0;

  while(i < words.length){

    let found = null;

    /*
     Probamos desde 5 palabras hasta 1.
    */

    for(let length=5;length>=1;length--){

      if(i+length > words.length) continue;

      const phrase =
        words.slice(i,i+length).join(" ");

      if(numberWords[phrase] !== undefined){

        found = {
          number:numberWords[phrase],
          length:length
        };

        break;

      }

    }


    if(found){

      /*
       Si el número está entre 0 y 800,
       suma uno al contador.
      */

      if(found.number >= 0 && found.number <= 800){

        count++;

        document.getElementById("count").textContent =
          count;

      }

      i += found.length;

    }else{

      i++;

    }

  }

}


/* ==========================================
   RECONOCIMIENTO DE VOZ
========================================== */

function init(){

  const SR =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;


  if(!SR){

    document.getElementById("status").textContent =
      "Este navegador no admite reconocimiento de voz. Probá Chrome.";

    return;

  }


  rec = new SR();

  rec.lang = "es-AR";

  rec.continuous = true;

  rec.interimResults = true;


  rec.onstart = ()=>{

    active = true;

    document.getElementById("start").textContent =
      "🛑 Detener";

    document.getElementById("status").textContent =
      "Escuchando…";

  };


  rec.onresult = e => {

    for(
      let i=e.resultIndex;
      i<e.results.length;
      i++
    ){

      if(e.results[i].isFinal){

        process(
          e.results[i][0].transcript
        );

      }

    }

  };


  rec.onerror = e => {

    document.getElementById("status").textContent =
      e.error === "not-allowed"
      ? "⚠️ Permití el acceso al micrófono."
      : "Error: " + e.error;

  };


  rec.onend = ()=>{

    if(active){

      try{
        rec.start();
      }catch(e){}

    }else{

      document.getElementById("start").textContent =
        "🎙️ Empezar";

      document.getElementById("status").textContent =
        "Pausado";

    }

  };

}


/* ==========================================
   BOTÓN EMPEZAR / DETENER
========================================== */

document.getElementById("start").onclick = ()=>{

  if(!rec) return;


  if(active){

    active = false;

    rec.stop();

  }else{

    try{
      rec.start();
    }catch(e){}

  }

};


/* ==========================================
   BOTÓN REINICIAR
========================================== */

document.getElementById("reset").onclick = ()=>{

  count = 0;

  document.getElementById("count").textContent =
    "0";

};


init();

</script>

</body>
</html>
