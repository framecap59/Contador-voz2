      <!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Contador Bobinado">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Contador Bobinado</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    min-height: 100vh;
    min-height: 100dvh;
    background: #0a0a0a;
    color: #f0f0f0;
    font-family: system-ui, -apple-system, Arial, sans-serif;
    display: flex;
    flex-direction: column;
    overflow-x: hidden;
  }

  /* ===== TEMAS ===== */
  :root {
    --accent: #22c55e;
    --accent-text: #000;
    --btn-bg: #1a1a1a;
    --btn-border: #333;
    --btn-text: #ddd;
    --big-btn: #1f1f1f;
  }
  body.theme-green {
    --accent: #22c55e; --accent-text: #000;
    --btn-bg: #0f1f14; --btn-border: #166534; --btn-text: #bbf7d0;
    --big-btn: #14532d;
  }
  body.theme-gray {
    --accent: #a3a3a3; --accent-text: #000;
    --btn-bg: #1a1a1a; --btn-border: #404040; --btn-text: #e5e5e5;
    --big-btn: #262626;
  }
  body.theme-blue {
    --accent: #3b82f6; --accent-text: #fff;
    --btn-bg: #0f172a; --btn-border: #1e3a5f; --btn-text: #bfdbfe;
    --big-btn: #1e3a5f;
  }
  body.theme-red {
    --accent: #ef4444; --accent-text: #fff;
    --btn-bg: #1c1010; --btn-border: #7f1d1d; --btn-text: #fecaca;
    --big-btn: #450a0a;
  }

  /* ===== LAYOUT PRINCIPAL ===== */
  .top-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 16px 0;
    gap: 8px;
  }
  .top-bar-left, .top-bar-right {
    display: flex;
    gap: 8px;
    align-items: center;
  }

  .icon-btn {
    width: 42px;
    height: 42px;
    border-radius: 12px;
    border: 1.5px solid var(--btn-border);
    background: var(--btn-bg);
    color: var(--btn-text);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    padding: 0;
  }
  .icon-btn svg { width: 20px; height: 20px; }
  .icon-btn:active { transform: scale(0.94); }

  .mode-badge {
    font-size: 12px;
    color: #888;
    background: #1a1a1a;
    padding: 4px 10px;
    border-radius: 20px;
  }

  .count-area {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 10px 16px;
    min-height: 0;
  }

  #count {
    font-size: clamp(100px, 32vw, 200px);
    font-weight: 700;
    line-height: 1;
    letter-spacing: -4px;
    color: #f5f5f5;
    transition: transform 0.08s;
  }

  #status {
    margin-top: 10px;
    font-size: 14px;
    color: #666;
    text-align: center;
    min-height: 20px;
  }

  #heard {
    font-size: 12px;
    color: #555;
    text-align: center;
    max-width: 90%;
    margin-top: 6px;
    min-height: 18px;
  }

  .cam-wrapper {
    width: 100%;
    display: flex;
    justify-content: center;
    padding: 0 16px;
    margin-bottom: 8px;
  }

  .cam-container {
    position: relative;
    width: min(55vw, 220px);
    aspect-ratio: 4/3;
    background: #111;
    border-radius: 14px;
    overflow: hidden;
    display: none;
    border: 2px solid #333;
    cursor: pointer;
  }
  .cam-container.active { display: block; }
  .cam-container.hidden-preview {
    width: 48px;
    height: 48px;
    aspect-ratio: 1;
    border-radius: 50%;
  }
  .cam-container.hidden-preview video,
  .cam-container.hidden-preview canvas,
  .cam-container.hidden-preview #camInfo {
    opacity: 0;
    pointer-events: none;
  }
  .cam-container.hidden-preview::after {
    content: "CAM";
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    font-weight: 700;
    color: var(--accent);
  }

  #video {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  #overlay {
    position: absolute;
    top: 0; left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
  }
  #camInfo {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    text-align: center;
    font-size: 11px;
    color: #fff;
    background: rgba(0,0,0,0.55);
    padding: 3px 4px;
  }

  .secondary-row {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    justify-content: center;
    padding: 0 12px 10px;
  }

  .sec-btn {
    border: 1.5px solid var(--btn-border);
    border-radius: 12px;
    padding: 10px 14px;
    font-size: 13px;
    font-weight: 600;
    background: var(--btn-bg);
    color: var(--btn-text);
    cursor: pointer;
    min-width: 90px;
  }
  .sec-btn:active { transform: scale(0.96); }
  .sec-btn.primary {
    background: var(--accent);
    border-color: var(--accent);
    color: var(--accent-text);
  }
  #switchCamBtn, #calibrateBtn { display: none; }

  .big-buttons {
    display: flex;
    width: 100%;
    padding: 0;
    margin-top: auto;
  }
  .big-btn {
    flex: 1;
    height: 76px;
    border: none;
    font-size: 36px;
    font-weight: 600;
    cursor: pointer;
    color: #fff;
    background: var(--big-btn);
    transition: filter 0.1s;
  }
  .big-btn:active { filter: brightness(1.25); }
  #minusBtn {
    border-radius: 20px 0 0 0;
    border-right: 1px solid #333;
  }
  #plusBtn {
    border-radius: 0 20px 0 0;
    background: var(--accent);
    color: var(--accent-text);
  }

  .watermark {
    position: fixed;
    bottom: 6px;
    right: 10px;
    font-size: 10px;
    color: #444;
    opacity: 0.4;
    pointer-events: none;
    z-index: 50;
    letter-spacing: 0.3px;
  }

  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.8);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 100;
    padding: 16px;
  }
  .modal-overlay.active { display: flex; }
  .modal {
    background: #111;
    border: 1px solid #333;
    border-radius: 16px;
    width: min(94vw, 380px);
    max-height: 80vh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }
  .modal-header {
    padding: 14px 16px;
    border-bottom: 1px solid #333;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-weight: 700;
    gap: 8px;
  }
  .modal-close {
    background: transparent;
    border: none;
    color: #888;
    font-size: 22px;
    cursor: pointer;
    padding: 4px 8px;
  }
  .modal-body {
    padding: 12px;
    overflow-y: auto;
    flex: 1;
  }
  .save-item {
    background: #1a1a1a;
    border: 1px solid #333;
    border-radius: 12px;
    padding: 12px 14px;
    margin-bottom: 8px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
  }
  .save-item-date { font-size: 13px; color: #888; }
  .save-item-count { font-size: 20px; font-weight: 700; }
  .save-item-actions { display: flex; gap: 6px; }
  .save-item-actions button {
    border: none;
    border-radius: 8px;
    padding: 8px 12px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
  }
  .btn-load { background: var(--accent); color: var(--accent-text); }
  .btn-delete { background: #333; color: #f87171; }
  .empty-history {
    text-align: center;
    color: #555;
    padding: 30px 10px;
    font-size: 14px;
  }
  .save-toast {
    position: fixed;
    bottom: 100px;
    left: 50%;
    transform: translateX(-50%);
    background: var(--accent);
    color: var(--accent-text);
    padding: 10px 20px;
    border-radius: 30px;
    font-weight: 700;
    font-size: 14px;
    opacity: 0;
    transition: opacity 0.3s;
    z-index: 200;
    pointer-events: none;
  }
  .save-toast.show { opacity: 1; }
</style>
</head>
<body>

<div class="top-bar">
  <div class="top-bar-left">
    <button class="icon-btn" id="saveBtn" title="Historial">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/>
        <polyline points="17 21 17 13 7 13 7 21"/>
        <polyline points="7 3 7 8 15 8"/>
      </svg>
    </button>
    <button class="icon-btn" id="themeBtn" title="Color">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="5"/>
        <path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>
      </svg>
    </button>
  </div>
  <div class="mode-badge" id="modeBadge">Listo</div>
  <div class="top-bar-right">
    <button class="icon-btn" id="reset" title="Reiniciar" style="font-size:18px;">↺</button>
  </div>
</div>

<div class="count-area">
  <div id="count">0</div>
  <div id="status">Listo</div>
  <div id="heard"></div>
</div>

<div class="cam-wrapper">
  <div class="cam-container" id="camContainer" title="Tocar para ocultar/mostrar">
    <video id="video" playsinline muted autoplay></video>
    <canvas id="overlay"></canvas>
    <div id="camInfo">Tocá para calibrar la zona</div>
  </div>
</div>

<div class="secondary-row">
  <button class="sec-btn primary" id="start">Voz</button>
  <button class="sec-btn" id="camBtn">Cámara</button>
  <button class="sec-btn" id="switchCamBtn">Cambiar cam</button>
  <button class="sec-btn" id="calibrateBtn">Calibrar</button>
</div>

<div class="big-buttons">
  <button class="big-btn" id="minusBtn">−</button>
  <button class="big-btn" id="plusBtn">+</button>
</div>

<div class="modal-overlay" id="historyModal">
  <div class="modal">
    <div class="modal-header">
      <span>Historial</span>
      <button class="modal-close" id="closeModal">×</button>
    </div>
    <div class="modal-body" id="historyList"></div>
  </div>
</div>

<div class="save-toast" id="saveToast">Guardado ✓</div>

<script>
let count = 0;
let voiceActive = false;
let camActive = false;
let camPreviewHidden = false;
let rec = null;

let stream = null;
let video = null;
let overlay = null;
let ctx = null;
let animId = null;

let zoneX = null, zoneY = null, zoneRadius = 70;
let calibrated = false;

let isNutVisible = false;
let lastSeenTime = 0;
let lastCountTime = 0;
const COUNT_COOLDOWN_MS = 400;
const BRIGHTNESS_THRESHOLD = 145;

const unidades = ["cero","uno","dos","tres","cuatro","cinco","seis","siete","ocho","nueve"];
const especiales = {10:"diez",11:"once",12:"doce",13:"trece",14:"catorce",15:"quince",16:"dieciseis",17:"diecisiete",18:"dieciocho",19:"diecinueve"};
const decenas = {20:"veinte",30:"treinta",40:"cuarenta",50:"cincuenta",60:"sesenta",70:"setenta",80:"ochenta",90:"noventa"};
const centenas = {100:"cien",200:"doscientos",300:"trescientos",400:"cuatrocientos",500:"quinientos",600:"seiscientos",700:"setecientos",800:"ochocientos"};

function normal(text) {
  return text.toLowerCase()
    .normalize("NFD").replace(/[\u0300-\u036f]/g,"")
    .replace(/[.,!?¿¡]/g," ")
    .replace(/\s+/g," ").trim();
}

function convertirMenor100(n) {
  if (n < 10) return unidades[n];
  if (n <= 19) return especiales[n];
  if (n === 20) return "veinte";
  if (n >= 21 && n <= 29) {
    const nombres = ["","uno","dos","tres","cuatro","cinco","seis","siete","ocho","nueve"];
    return "veinti" + nombres[n-20];
  }
  const dec = Math.floor(n/10)*10;
  const u = n % 10;
  if (u === 0) return decenas[dec];
  return decenas[dec] + " y " + unidades[u];
}

const numberWords = {};
for (let i = 0; i <= 9; i++) numberWords[unidades[i]] = i;
for (let i = 10; i <= 19; i++) numberWords[especiales[i]] = i;
for (let i = 20; i <= 99; i++) numberWords[convertirMenor100(i)] = i;
for (let cen = 100; cen <= 800; cen += 100) {
  numberWords[centenas[cen]] = cen;
  if (cen === 800) break;
  for (let resto = 1; resto <= 99; resto++) {
    let texto = (cen === 100) ? "ciento " + convertirMenor100(resto) : centenas[cen] + " " + convertirMenor100(resto);
    numberWords[texto] = cen + resto;
  }
}
for (const word of Object.keys(numberWords)) {
  numberWords[normal(word)] = numberWords[word];
}

function process(text) {
  const clean = normal(text);
  document.getElementById("heard").textContent = text.trim() ? "Escuché: " + text.trim() : "";
  const words = clean.split(/\s+/);
  let i = 0;
  while (i < words.length) {
    let found = null;
    if (words[i] === "camara" || words[i] === "cámara") { toggleCamera(); i++; continue; }
    if (words[i] === "reiniciar" || words[i] === "reset") { resetCount(); i++; continue; }
    if (words[i] === "siguiente" || words[i] === "vuelta" || words[i] === "una") found = { length: 1 };
    if (!found) {
      for (let length = 5; length >= 1; length--) {
        if (i + length > words.length) continue;
        const phrase = words.slice(i, i + length).join(" ");
        if (numberWords[phrase] !== undefined) { found = { length }; break; }
      }
    }
    if (found) { incrementCount(); i += found.length; }
    else i++;
  }
}

function incrementCount() {
  count++;
  document.getElementById("count").textContent = count;
  const el = document.getElementById("count");
  el.style.transform = "scale(1.06)";
  setTimeout(() => el.style.transform = "scale(1)", 80);
}

function resetCount() {
  count = 0;
  document.getElementById("count").textContent = "0";
  isNutVisible = false;
  lastCountTime = 0;
  lastSeenTime = 0;
}

function initVoice() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) {
    document.getElementById("status").textContent = "Usá Chrome para voz";
    return;
  }
  rec = new SR();
  rec.lang = "es-AR";
  rec.continuous = true;
  rec.interimResults = true;
  rec.onstart = () => {
    voiceActive = true;
    document.getElementById("start").textContent = "Detener";
    updateStatus();
  };
  rec.onresult = e => {
    for (let i = e.resultIndex; i < e.results.length; i++) {
      if (e.results[i].isFinal) process(e.results[i][0].transcript);
    }
  };
  rec.onerror = e => {
    document.getElementById("status").textContent =
      e.error === "not-allowed" ? "⚠️ Permití el micrófono" : "Error voz: " + e.error;
  };
  rec.onend = () => {
    if (voiceActive) {
      try { rec.start(); } catch (e) {}
    } else {
      document.getElementById("start").textContent = "Voz";
      updateStatus();
    }
  };
}

async function toggleCamera() {
  if (camActive) stopCamera();
  else await startCamera();
}

let currentFacingMode = "user";

async function startCamera(facing = currentFacingMode) {
  if (stream) {
    stream.getTracks().forEach(t => t.stop());
    stream = null;
  }
  try {
    let constraints = {
      video: { facingMode: { exact: facing }, width: { ideal: 640 }, height: { ideal: 480 } },
      audio: false
    };
    try {
      stream = await navigator.mediaDevices.getUserMedia(constraints);
    } catch (e) {
      constraints.video.facingMode = { ideal: facing };
      stream = await navigator.mediaDevices.getUserMedia(constraints);
    }
    currentFacingMode = facing;
    video = document.getElementById("video");
    overlay = document.getElementById("overlay");
    ctx = overlay.getContext("2d");
    video.srcObject = stream;
    await video.play();
    const resize = () => {
      overlay.width = video.videoWidth || 640;
      overlay.height = video.videoHeight || 480;
    };
    video.onloadedmetadata = resize;
    resize();
    const container = document.getElementById("camContainer");
    container.classList.add("active");
    container.classList.remove("hidden-preview");
    camPreviewHidden = false;
    document.getElementById("calibrateBtn").style.display = "inline-block";
    document.getElementById("switchCamBtn").style.display = "inline-block";
    camActive = true;
    updateStatus();
    isNutVisible = false;
    lastCountTime = 0;
    lastSeenTime = 0;
    calibrated = false;
    zoneX = zoneY = null;
    processFrame();
    const camName = facing === "user" ? "DELANTERA" : "TRASERA";
    document.getElementById("status").textContent = "Cámara " + camName;
  } catch (err) {
    document.getElementById("status").textContent = "No se pudo abrir cámara";
  }
}

function stopCamera() {
  camActive = false;
  if (animId) cancelAnimationFrame(animId);
  if (stream) {
    stream.getTracks().forEach(t => t.stop());
    stream = null;
  }
  const container = document.getElementById("camContainer");
  container.classList.remove("active", "hidden-preview");
  document.getElementById("calibrateBtn").style.display = "none";
  document.getElementById("switchCamBtn").style.display = "none";
  calibrated = false;
  zoneX = zoneY = null;
  isNutVisible = false;
  camPreviewHidden = false;
  updateStatus();
}

function toggleCamPreview() {
  if (!camActive) return;
  camPreviewHidden = !camPreviewHidden;
  document.getElementById("camContainer").classList.toggle("hidden-preview", camPreviewHidden);
}

function processFrame() {
  if (!camActive) return;
  const now = performance.now();
  ctx.clearRect(0, 0, overlay.width, overlay.height);
  if (calibrated && zoneX !== null) {
    ctx.beginPath();
    ctx.arc(zoneX, zoneY, zoneRadius, 0, Math.PI * 2);
    ctx.strokeStyle = isNutVisible ? "rgba(34,197,94,0.9)" : "rgba(239,68,68,0.7)";
    ctx.lineWidth = 3;
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(zoneX, zoneY, 4, 0, Math.PI * 2);
    ctx.fillStyle = isNutVisible ? "#22c55e" : "#ef4444";
    ctx.fill();
    const bright = findBrightestInZone(zoneX, zoneY, zoneRadius);
    const currentlyVisible = bright !== null;
    if (currentlyVisible) {
      ctx.beginPath();
      ctx.arc(bright.x, bright.y, 9, 0, Math.PI * 2);
      ctx.fillStyle = "#f59e0b";
      ctx.fill();
      ctx.strokeStyle = "#fff";
      ctx.lineWidth = 2;
      ctx.stroke();
    }
    if (currentlyVisible) {
      if (!isNutVisible) {
        if (now - lastCountTime > COUNT_COOLDOWN_MS) {
          incrementCount();
          lastCountTime = now;
          document.getElementById("camInfo").textContent = `✓ Vuelta | ${count}`;
        }
      } else if (now - lastCountTime > 400) {
        document.getElementById("camInfo").textContent = `Visible | ${count}`;
      }
      isNutVisible = true;
      lastSeenTime = now;
    } else {
      if (now - lastSeenTime > 180) {
        isNutVisible = false;
        document.getElementById("camInfo").textContent = `Esperando... | ${count}`;
      }
    }
  } else {
    document.getElementById("camInfo").textContent = "Tocá donde aparece la tuerca";
  }
  animId = requestAnimationFrame(processFrame);
}

function findBrightestInZone(cx, cy, r) {
  const tempCanvas = document.createElement("canvas");
  tempCanvas.width = overlay.width;
  tempCanvas.height = overlay.height;
  const tctx = tempCanvas.getContext("2d", { willReadFrequently: true });
  tctx.drawImage(video, 0, 0, tempCanvas.width, tempCanvas.height);
  const data = tctx.getImageData(0, 0, tempCanvas.width, tempCanvas.height).data;
  let maxBright = 0, bestX = null, bestY = null;
  const r2 = r * r, step = 2;
  for (let y = Math.max(0, cy - r); y < Math.min(tempCanvas.height, cy + r); y += step) {
    for (let x = Math.max(0, cx - r); x < Math.min(tempCanvas.width, cx + r); x += step) {
      const dx = x - cx, dy = y - cy;
      if (dx*dx + dy*dy > r2) continue;
      const idx = (Math.floor(y) * tempCanvas.width + Math.floor(x)) * 4;
      const bright = data[idx]*0.299 + data[idx+1]*0.587 + data[idx+2]*0.114;
      if (bright > maxBright && bright > BRIGHTNESS_THRESHOLD) {
        maxBright = bright;
        bestX = x; bestY = y;
      }
    }
  }
  return bestX === null ? null : { x: bestX, y: bestY };
}

function setupCalibration() {
  const container = document.getElementById("camContainer");
  container.addEventListener("click", (e) => {
    if (!camActive) return;
    if (camPreviewHidden) { toggleCamPreview(); return; }
    if (calib
